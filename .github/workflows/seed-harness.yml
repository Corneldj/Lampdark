# GEN-14: the seed harness runs on any change to the templates, the generator, the mine's tuning or
# the harness itself (Gameplay §12.3, GDD §15.9): 2,000 seeds here, all 10,000 in the nightly (the
# full run does not fit this job's budget on a hosted runner). A failed gate fails the job; the
# report (report.md, report.json, timing.json) is kept as an artefact either way.
name: seed-harness
on:
  push:
    paths:
      - "data/templates/**"
      - "native/src/core/gen/**"
      - "native/src/core/world/**"
      - "native/src/harness/**"
      - "native/src/godot/gen/**"
      - "data/tuning/mine.json"
      - "data/tuning/traps.json"
      - "server/world/**"
      - "tools/seed_harness/**"
  pull_request:
    branches: [main]
    paths:
      - "data/templates/**"
      - "native/src/core/gen/**"
      - "native/src/core/world/**"
      - "native/src/harness/**"
      - "native/src/godot/gen/**"
      - "data/tuning/mine.json"
      - "data/tuning/traps.json"
      - "server/world/**"
      - "tools/seed_harness/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  native:
    uses: ./.github/workflows/native.yml

  seed_harness:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lfs-pull
      - run: tools/build/ci_setup_linux.sh tests
      - uses: ./.github/actions/setup-godot
      - uses: actions/download-artifact@v4
        with:
          name: native-bin
          path: native/bin
      - name: Seed harness, 2,000 seeds (GEN-14)
        # Report-only until GEN-16's v1 template pack is the shipped set: today's single template
        # cannot generate a mine. GEN-16 removes LB_HARNESS_GATES here and in the nightly.
        env:
          LB_HARNESS_GATES: report
        run: LB_SEEDS=2000 tools/build/ci_nightly_slot.sh seed_harness
      - name: Upload the harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-harness-report
          path: build/seed_harness/
          if-no-files-found: ignore
          retention-days: 14
