# FND-04: the native build, shared by the per-push, seed-harness and nightly pipelines. Builds
# lampblack_core for Linux and (MinGW cross, FND-02) Windows, both targets; runs the Linux doctests;
# checks layering and Windows imports; writes the Linux determinism digest.
name: native
on:
  workflow_call:

jobs:
  native:
    runs-on: ubuntu-24.04
    # A cold build (godot-cpp, WebRTC audio processing, both targets, both platforms) runs ~45 min on
    # a hosted runner; the SCons cache makes later ones a fraction of that.
    timeout-minutes: 90
    env:
      LB_SCONS_CACHE: ${{ github.workspace }}/.scons-cache
      # Shared runners report the core's timing budgets rather than gate on them (QA-03 holds them).
      LB_TIMING_REPORT_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/lfs-pull
      - name: Install the toolchains
        run: tools/build/ci_setup_linux.sh native
      - name: Restore the SCons cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LB_SCONS_CACHE }}
          key: scons-${{ hashFiles('versions.json', 'native/SConstruct') }}-${{ github.sha }}
          # Any earlier cache serves when the exact one misses: SCons keys every object by its own
          # content, so a stale entry is never used, only skipped (an edit to SConstruct or
          # versions.json then rebuilds what changed, not everything).
          restore-keys: |
            scons-${{ hashFiles('versions.json', 'native/SConstruct') }}-
            scons-
      - name: Build, doctest, layering, imports, digest
        run: tools/build/ci_native.sh
      # Saved even when a later step fails, so a build that ran out of time seeds the next.
      - name: Save the SCons cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LB_SCONS_CACHE }}
          key: scons-${{ hashFiles('versions.json', 'native/SConstruct') }}-${{ github.sha }}
      - name: Doctest report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: native/bin/doctest.linux.*.xml
          check_name: doctest (Linux)
      - name: Upload the native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-bin
          path: |
            native/bin/
            !native/bin/symbols/
          retention-days: 3
      - name: Upload the release symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: native/bin/symbols/
          retention-days: 90
      - name: Upload the Linux digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-linux
          path: build/digest/linux.template_release.sha256
          retention-days: 3
